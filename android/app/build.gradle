plugins {
    id 'com.android.application' version '8.13.2'
    id 'org.jetbrains.kotlin.android' version '1.9.22'
    id 'kotlin-kapt'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def releaseKeystorePath = localProperties.getProperty("RELEASE_STORE_FILE")
def hasReleaseSigning = releaseKeystorePath != null && !releaseKeystorePath.isEmpty() && new File(releaseKeystorePath).exists()

android {
    namespace 'com.copdhealthtracker'
    compileSdk 36

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword localProperties.getProperty("RELEASE_STORE_PASSWORD", "")
                keyAlias localProperties.getProperty("RELEASE_KEY_ALIAS", "")
                keyPassword localProperties.getProperty("RELEASE_KEY_PASSWORD", "")
            }
        }
    }

    defaultConfig {
        applicationId "com.copdhealthtracker"
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName "1.0.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE_URL", "\"https://d2gfwfsr2a.execute-api.us-east-2.amazonaws.com\""
        buildConfigField "String", "PRIVACY_POLICY_URL", "\"https://www.copdfuel.com/privacy.html\""
        buildConfigField "String", "TERMS_OF_USE_URL", "\"https://www.copdfuel.com/terms.html\""
        buildConfigField "String", "GOOGLE_PLACES_API_KEY", "\"${localProperties.getProperty("GOOGLE_PLACES_API_KEY", "")}\""
        buildConfigField "String", "USDA_FDC_API_KEY", "\"${localProperties.getProperty("USDA_FDC_API_KEY", "")}\""
        buildConfigField "String", "SUBSCRIPTION_PRODUCT_ID", "\"copdfuel_premium_monthly\""
        
        kapt {
            arguments {
                arg("room.schemaLocation", "$projectDir/schemas")
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'
    
    // Room database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // Preferences
    implementation 'androidx.preference:preference-ktx:1.2.1'
    
    // FlexboxLayout for specialty tags
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    
    // Location services
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // Health Connect (device data: SpO2 from watch/phone) - requires API 26+ at runtime
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha10'
    
    // Google Play Billing (in-app subscription)
    // billing-ktx is intentionally omitted: we use the callback API, not its suspend
    // extensions, and it drags in Kotlin 2.x metadata this project's compiler can't read.
    implementation 'com.android.billingclient:billing:9.1.0'
    
    // Cognito User Pools (auth)
    implementation 'com.amazonaws:aws-android-sdk-auth-userpools:2.81.1'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
